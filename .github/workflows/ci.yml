name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Build + Domain/Application tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore Sigil.slnx

      - name: Build
        run: dotnet build Sigil.slnx -c Release --no-restore

      - name: Test Domain
        run: >
          dotnet test tests/Sigil.Domain.Tests/Sigil.Domain.Tests.csproj
          -c Release --no-build --nologo
          --logger "trx;LogFileName=domain.trx"

      - name: Test Application
        run: >
          dotnet test tests/Sigil.Application.Tests/Sigil.Application.Tests.csproj
          -c Release --no-build --nologo
          --logger "trx;LogFileName=application.trx"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trx-fast
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  infrastructure:
    name: Infrastructure tests (PostgreSQL containers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: fast

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Verify Docker
        run: docker info

      - name: Test Infrastructure
        run: >
          dotnet test tests/Sigil.Infrastructure.Tests/Sigil.Infrastructure.Tests.csproj
          -c Release --nologo
          --logger "trx;LogFileName=infrastructure.trx"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trx-infrastructure
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
